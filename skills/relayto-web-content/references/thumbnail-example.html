<!-- Worked example: the thumbnail of an investor portal page (1600x900), for a made-up company.
     Replace {{FONTS_DIR}} and {{ASSETS_DIR}} with absolute file:// folders, then put in the page's own
     brand: palette, fonts, logo, words, the key figure and the page's signature shape (here, a bar
     chart of the last five quarters). Render:
     chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1600,900
       --virtual-time-budget=4000 --screenshot=thumbnail.png file:///abs/path/thumbnail.html -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Brand;src:url("{{FONTS_DIR}}/brand-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:Brand;src:url("{{FONTS_DIR}}/brand-600.woff2") format("woff2");font-weight:600}
@font-face{font-family:BrandDisplay;src:url("{{FONTS_DIR}}/brand-display-700.woff2") format("woff2");font-weight:700}
:root{--ground:#0b2236;--ink:#ffffff;--accent:#f2b33d;--muted:rgba(255,255,255,.72)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;background:var(--ground);overflow:hidden}
body{position:relative;font-family:Brand,Arial,sans-serif;color:var(--ink)}
.logo{position:absolute;left:96px;top:84px;height:56px;width:auto}
.title{position:absolute;left:88px;top:240px;font-family:BrandDisplay,Arial,sans-serif;font-weight:700;font-size:196px;line-height:.9;letter-spacing:-.02em}
.title span{display:block}
.title .accent{color:var(--accent)}
.sub{position:absolute;left:96px;top:676px;font-size:34px;font-weight:600;color:var(--muted)}
.card{position:absolute;right:96px;top:150px;width:470px;background:#fff;color:var(--ground);padding:36px 38px 40px;border-radius:6px}
.card h2{font-family:BrandDisplay,Arial,sans-serif;font-size:40px;line-height:1.05;font-weight:700}
.chart{height:150px;margin:26px 0 24px}
.chart svg{display:block;width:100%;height:100%}
.fig{font-family:BrandDisplay,Arial,sans-serif;font-weight:700;font-size:124px;line-height:.86;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fig small{font-size:62px;letter-spacing:0}
.lab{font-size:28px;font-weight:600;margin-top:14px}
.chg{display:inline-block;margin-top:18px;background:var(--accent);color:var(--ground);font-weight:600;font-size:28px;padding:8px 14px;border-radius:4px}
.band{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--accent);display:flex;align-items:center;padding:0 96px}
.band b{font-family:BrandDisplay,Arial,sans-serif;font-size:40px;color:var(--ground);white-space:nowrap}
</style></head><body>
<img class="logo" src="{{ASSETS_DIR}}/logo-white.svg" alt="">
<h1 class="title"><span>Investor</span><span class="accent">Portal</span></h1>
<p class="sub">Northwind Holdings</p>
<div class="card"><h2>Q3 2026 results</h2>
<div class="chart"><svg viewBox="0 0 400 150" aria-hidden="true">
  <rect x="0" y="62" width="56" height="88" fill="#c9d3dd"/><rect x="86" y="54" width="56" height="96" fill="#c9d3dd"/>
  <rect x="172" y="44" width="56" height="106" fill="#c9d3dd"/><rect x="258" y="30" width="56" height="120" fill="#c9d3dd"/>
  <rect x="344" y="8" width="56" height="142" fill="#f2b33d"/></svg></div>
<p class="fig">$1.2<small>B</small></p><p class="lab">Net sales</p><p class="chg">+8.4% year on year</p></div>
<div class="band"><b>Q3 2026 · Investor Portal</b></div>
</body></html>
